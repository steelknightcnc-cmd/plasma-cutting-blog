<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title }}</title>

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#070b14">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=24.0">
</head>
<body class="{{ page.body_class | default: 'article-page' }}">
  <header class="site-header industrial-header">
    <a class="brand industrial-brand" href="/#top" aria-label="Plasma Cut Forge home">
      <span class="brand-wordmark">PLASMA<span>CUT</span>FORGE</span>
      <small>CNC plasma tools &amp; shop-floor guides</small>
    </a>

    <nav class="industrial-nav" aria-label="Primary navigation">
      <a href="/#top">Home</a>
      <a href="/#calculator">Calculator</a>
      <a class="{% if page.url contains '/blog' %}active{% endif %}" href="/blog/">Blog</a>
      <a class="{% if page.url contains '/community' %}active{% endif %}" href="/community/">Community</a>
      <a href="/#articles">Articles</a>
      <a href="/#about">About</a>
    </nav>
  </header>

  {{ content }}

  <footer>
    <p>© {{ site.time | date: '%Y' }} Plasma Cut Forge.</p>
    <p><a href="/#calculator">Plasma cutting calculator</a></p>
  </footer>
</body>
</html>
